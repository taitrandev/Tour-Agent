name: Backend CI & Artifact Build

on:
  push:
    branches: [ main ]
    paths:
      - 'dotnet-backend-core-main/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'dotnet-backend-core-main/**'

# Yêu cầu bắt buộc để GitHub cấp token OIDC
permissions:
  id-token: write  # Bắt buộc để xin JWT từ GitHub OIDC provider
  contents: read   # Đọc source code

# Chống chạy song song: các lần chạy cùng ref sẽ xếp hàng theo thứ tự
# - PR: hủy run cũ khi có commit mới (tiết kiệm tài nguyên)
# - Push main: KHÔNG hủy run đang chạy (tránh bỏ dở giữa lúc deploy), run mới chờ run cũ xong
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/TourAgent.slnx'

      - name: Restore dependencies
        run: dotnet restore dotnet-backend-core-main/TourAgent.slnx

      - name: Build
        run: dotnet build dotnet-backend-core-main/TourAgent.slnx -c Release --no-restore

      - name: Test
        run: dotnet test dotnet-backend-core-main/TourAgent.slnx --no-build -c Release --verbosity normal

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Nếu chỉ là Pull Request: Chỉ test compile Dockerfile, không login Azure, không push image
      - name: Build Docker Image (PR Validation Only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./dotnet-backend-core-main
          file: ./dotnet-backend-core-main/Dockerfile
          push: false
          tags: touragent-api:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Nếu là Push nhánh main: Xác thực OIDC với Azure và Push Image
      - name: Azure Login via OIDC
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and Push Docker Image to ACR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./dotnet-backend-core-main
          file: ./dotnet-backend-core-main/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/touragent-api:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy to Azure Container Apps
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Image to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ vars.ACA_NAME }} \
            --resource-group ${{ vars.AZURE_RG }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/touragent-api:${{ github.sha }}

      - name: Get Container App FQDN
        id: get-fqdn
        run: |
          FQDN=$(az containerapp show --name ${{ vars.ACA_NAME }} --resource-group ${{ vars.AZURE_RG }} --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT

      - name: Smoke Test Readiness
        run: |
          echo "Testing readiness at: https://${{ steps.get-fqdn.outputs.fqdn }}/health/ready"
          curl -f "https://${{ steps.get-fqdn.outputs.fqdn }}/health/ready" \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 15

